<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tienda de Ropa</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header -->
  <nav class="navbar sticky-top shadow-sm">
    <div class="container-fluid justify-content-between">
      <span class="navbar-brand mb-0 h1">Tienda de Ropa</span>
      <button class="btn btn-custom btn-sm" data-bs-toggle="modal" data-bs-target="#modalPrenda" onclick="prepararFormularioAgregar()">
        <i class="fas fa-plus me-1"></i> Agregar Prenda
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main class="container my-4 flex-grow-1">
    <!-- Tabla de prendas -->
    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Listado de Prendas</span>

      </div>
      <div class="table-container">
        <table class="table table-bordered table-hover table-sm mb-0" id="tablaPrendas">
          <thead class="sticky-top">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Marca</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Tabla vendidas -->
    <div class="card mb-4">
      <div class="card-header">Prendas Vendidas y Stock Restante</div>
      <div class="table-container">
        <table class="table table-bordered table-sm mb-0" id="tablaVendidas">
          <thead class="sticky-top">
            <tr>
              <th>Prenda</th>
              <th>Vendidas</th>
              <th>Stock</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Marcas y top -->
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-header">Marcas con Ventas</div>
          <div class="table-container">
            <table class="table table-bordered table-sm mb-0" id="tablaMarcas">
              <thead class="sticky-top"><tr><th>Marca</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card h-100">
          <div class="card-header">Top 5 Marcas por Ventas</div>
          <div class="table-container">
            <table class="table table-bordered table-sm mb-0" id="tablaTopMarcas">
              <thead class="sticky-top"><tr><th>Marca</th><th>Ventas</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal fade" id="modalPrenda" tabindex="-1" aria-labelledby="modalPrendaLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="formPrenda">
          <div class="modal-header">
            <h5 class="modal-title" id="modalPrendaLabel">Agregar Prenda</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="idPrenda" name="idPrenda">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre de la prenda</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
              <label for="marca" class="form-label">Marca existente</label>
              <select id="marca" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label for="nuevaMarca" class="form-label">O nueva marca (prioritaria)</label>
              <input type="text" class="form-control" id="nuevaMarca" placeholder="Nueva marca (opcional)">
            </div>
            <div class="mb-3">
              <label for="precio" class="form-label">Precio</label>
              <input type="number" step="0.01" class="form-control" id="precio" required>
            </div>
            <div class="mb-3">
              <label for="stock" class="form-label">Stock</label>
              <input type="number" class="form-control" id="stock" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-custom" id="btnSubmit">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
